<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 112" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Synex on Discord</title>
  <desc id="desc">A language-neutral link banner for the official Synex community on Discord.</desc>
  <defs>
    <linearGradient id="panel" x1="18" y1="10" x2="700" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1220"/>
      <stop offset=".55" stop-color="#10172A"/>
      <stop offset="1" stop-color="#17152B"/>
    </linearGradient>
    <linearGradient id="border" x1="36" y1="8" x2="684" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5ED7FF" stop-opacity=".72"/>
      <stop offset=".5" stop-color="#4B94FF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#8B73FF" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="mark" x1="24" y1="22" x2="88" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5ED7FF"/>
      <stop offset=".52" stop-color="#4B94FF"/>
      <stop offset="1" stop-color="#8B73FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#8BA4CC" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="718" height="110" rx="15" fill="url(#panel)"/>
  <rect x="1" y="1" width="718" height="110" rx="15" fill="url(#grid)"/>
  <rect x="1" y="1" width="718" height="110" rx="15" stroke="url(#border)" stroke-width="2"/>

  <circle cx="75" cy="55" r="43" fill="#4B94FF" fill-opacity=".11" filter="url(#glow)"/>
  <g transform="translate(20 10) scale(.94)">
    <path d="M76 18H39C27.4 18 18 27.4 18 39s9.4 21 21 21h18c6.1 0 11 4.9 11 11s-4.9 11-11 11H20" stroke="url(#mark)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="70" y="12" width="12" height="12" rx="3" fill="#5ED7FF"/>
    <rect x="14" y="76" width="12" height="12" rx="3" fill="#8B73FF"/>
  </g>

  <path d="M116 22V90" stroke="#91A4C4" stroke-opacity=".18"/>

  <text x="142" y="51" fill="#F5F8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700" letter-spacing="1.1">SYNEX / DISCORD</text>
  <text x="142" y="78" fill="#A7B5CD" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">discord.gg/heJU5t2Hfa</text>

  <path d="M516 56H646" stroke="url(#border)" stroke-width="2" stroke-dasharray="3 9"/>
  <circle cx="516" cy="56" r="4" fill="#5ED7FF"/>
  <circle cx="646" cy="56" r="27" fill="#5865F2" fill-opacity=".16" stroke="#7B78FF" stroke-opacity=".72"/>
  <path d="M637 56H655M649 50L655 56L649 62" stroke="#F5F8FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
