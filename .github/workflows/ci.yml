name: Synex Notification CI

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/discord/**"
      - ".github/workflows/**"
      - "docs/discord-notifications.md"
      - "README.md"
      - "docs/locales/**/README.md"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/scripts/discord/**"
      - ".github/workflows/**"
      - "docs/discord-notifications.md"
      - "README.md"
      - "docs/locales/**/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate notification infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: |
          node --check .github/scripts/discord/config.mjs
          node --check .github/scripts/discord/github.mjs
          node --check .github/scripts/discord/send.mjs
          node --check .github/scripts/discord/templates.mjs
          node --check .github/scripts/discord/utils.mjs
          node --check .github/scripts/discord/validate-workflows.mjs

      - name: Validate workflow policy
        run: node .github/scripts/discord/validate-workflows.mjs

      - name: Run notification tests
        run: >-
          node --test
          .github/scripts/discord/tests/github.test.mjs
          .github/scripts/discord/tests/send.test.mjs
          .github/scripts/discord/tests/templates.test.mjs
          .github/scripts/discord/tests/utils.test.mjs
