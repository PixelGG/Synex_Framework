name: Discord - CI Status

on:
  workflow_run:
    workflows: ["Synex Notification CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: discord-ci-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  notify:
    name: Publish CI status
    if: ${{ github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Render and deliver notification
        env:
          DISCORD_WEBHOOK_CI: ${{ secrets.DISCORD_WEBHOOK_CI }}
          DISCORD_WEBHOOK_DEFAULT: ${{ secrets.DISCORD_WEBHOOK_DEFAULT }}
          DISCORD_WEBHOOK_NAME: ${{ vars.DISCORD_WEBHOOK_NAME }}
          DISCORD_BRAND_ICON_URL: ${{ vars.DISCORD_BRAND_ICON_URL }}
          DISCORD_NOTIFY_CI_SUCCESS: ${{ vars.DISCORD_NOTIFY_CI_SUCCESS }}
        run: node .github/scripts/discord/send.mjs --type ci
