name: Synex Framework CI

on:
  push:
    branches: ["**"]
    paths:
      - "core/**"
      - "compat/**"
      - "resources/**"
      - "libraries/**"
      - "packages/**"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - "examples/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - "CHANGELOG.md"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - "tsconfig.json"
      - ".luarc.json"
      - ".github/workflows/framework-ci.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "core/**"
      - "compat/**"
      - "resources/**"
      - "libraries/**"
      - "packages/**"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - "examples/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - "CHANGELOG.md"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - "tsconfig.json"
      - ".luarc.json"
      - ".github/workflows/framework-ci.yml"
  workflow_dispatch:
    inputs:
      online_upstream_drift:
        description: Compare official QB/QBX/ESX main-branch sources with reviewed pins
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: framework-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Contracts, build, tests, and policy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check Synex UI
        run: npm run check:ui

      - name: Run Synex UI unit and component tests
        run: npm run test:ui

      - name: Build Synex UI package and runtime
        run: npm run build:ui

      - name: Verify committed Synex UI output is current
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all -- libraries/synex_ui/dist libraries/synex_ui/web/dist)"
          if [[ -n "$status" ]]; then
            echo "synex_ui generated output differs from the committed build:"
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Verify generated contracts are current
        run: npm run generate:check

      - name: Build TypeScript
        run: npx tsc --build --pretty false

      - name: Validate manifests and contracts
        run: npm run validate

      - name: Run headless Lua runtime tests
        run: npm run test:lua

      - name: Run lifecycle and graceful-reload tests
        run: node tools/test-runner.mjs core

      - name: Run deterministic platform stress tests
        run: node tools/test-runner.mjs stress

      - name: Run developer-tooling tests
        run: node tools/test-runner.mjs tooling

      - name: Run entity and control-plane tests
        run: node tools/test-runner.mjs entities

      - name: Run compatibility and migration-planner tests
        run: node tools/test-runner.mjs compatibility

      - name: Run compatibility analyzer
        run: node --experimental-strip-types tools/cli/src/bin.ts compat scan .

      - name: Verify compatibility review lock offline
        run: node --experimental-strip-types tools/cli/src/bin.ts compat drift

      - name: Check official compatibility sources online
        if: github.event_name == 'workflow_dispatch' && inputs.online_upstream_drift
        run: node --experimental-strip-types tools/cli/src/bin.ts compat drift --online --timeout 10000

      - name: Validate documentation, links, and manifest file coverage
        run: node tools/test-runner.mjs documentation

      - name: Run static security analyzer
        run: npm run security

      - name: Certify repository
        run: npm run certify

      - name: Audit Node.js dependency graph
        run: npm audit --audit-level=high

  ui-visual:
    name: Synex UI browser visual regression
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Synex UI browser visual regression
        run: npm run test:ui:visual

  database:
    name: MariaDB migrations and invariants
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:11.8.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_DATABASE: synex_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SYNEX_TEST_DATABASE_LIVE: "1"
      SYNEX_TEST_DATABASE_URL: mysql://root@127.0.0.1:3306/synex_test_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build database tests
        run: npx tsc --build --pretty false

      - name: Apply migrations and test database invariants
        run: npm run test:database
